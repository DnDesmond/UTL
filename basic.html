<!Doctype html>
<html>
    <head>
        <link rel="stylesheet" href="styles_flask.css">
    </head>
    <body>
        <form method="POST" action="#">
            Enter the first base:
            <input type="text" placeholder="Current Base" id="first" name="firstb" value="{{starter}}"><br>
            Enter the second base:
            <input type="text" placeholder="New Base" id="second" name="secondb" value="{{ender}}"><br>
            Enter the current value:
            <input type="text" placeholder="Current value" id="current" name="current" value={{nombre}}><br>
            <input type="submit" name="submit" id="submit"><br>
            Result:
            {{result}}
        </form>
    </body>
</html>
