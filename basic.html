<!Doctype html>
<html>
    <head>
        <link rel="stylesheet" href="styles_flask.css">
    </head>
    <body>
        <form method="POST" action="#">
            <p>Enter the current base:</p>
            <p class="centered">Enter the target base:</p>
            <p style="float: inline-end;">Enter the current value:</p><br><br><br>
            <input type="text" placeholder="Current Base" id="first" name="firstb" value="{{starter}}">
            <input type="text" placeholder="New Base" id="second" name="secondb" value="{{ender}}" style="margin-left: 16%; margin-right: 50%; text-align: center; position: absolute;">
            <input type="text" placeholder="Current value" id="current" name="current" value={{nombre}} style="float: inline-end;"><br><br>
            <input type="submit" name="submit" id="submit" style="margin: 200px; margin-left: 46.5%; text-align: center; padding: 10px;"><br>
            <p style="margin-left: 44%;  border: 7px outset white; width: max-content; padding: 10px; background-color: #666666; border-radius: 20px;">Result:&nbsp{{result}}</p>
        </form>
    </body>
</html>
