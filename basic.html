<!Doctype html>
<html>
    <head>
        <link rel="stylesheet" href="styles_flask.css">
        <link rel="icon" type="image/x-icon" href="tottles/totles999.png">
    </head>
    <body>
        <video muted autoplay loop id="meine">
            <source src="mygeneratedvideo.mp4" type="video/mp4">
        </video>
        <form method="POST" action="#">
            <p>Enter the current value:</p>
            <p class="centered">Enter the current base:</p>
            <p style="float: inline-end;">Enter the target base:</p><br><br><br>
            <input type="text" placeholder="Current Value" id="first" name="current" value="{{nombre}}">
            <p style="float: left; width: 3.1%;"></p>
            <input type="text" placeholder="Current Base" id="second" name="first_base" value="{{starter}}" style="text-align: center; float: left;">
            <input type="text" placeholder="New Base" id="current" name="second_base" value={{ender}} style="float: inline-end;"><br><br>
            <input type="submit" name="submit" id="submit" style="margin: 100px; margin-left: 46.5%; text-align: center; padding: 10px;"><br>
            <p style="color: white; margin-left: 44%;  border: 7px outset white; width: max-content; padding: 10px; background-color: #666666; border-radius: 20px;">Result:&nbsp{{result}}</p>
        </form>
    </body>
</html>
